<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tera AI</title>
<style>
body{font-family:sans-serif;margin:0;padding:16px;background:#f5f5f5}
h2{margin-top:0}
textarea{width:100%;height:150px;font-size:18px;padding:10px;box-sizing:border-box}
button{font-size:16px;padding:12px;margin:4px 2px;border:0;border-radius:8px;background:#2563eb;color:#fff}
#v{background:#16a34a}
#out{background:#fff;padding:12px;margin-top:12px;min-height:60px;font-size:18px;border-radius:8px}
</style>
</head>
<body>
<h2>✍️ Tera AI</h2>
<textarea id="t" placeholder="Yahan likho ya bolo..."></textarea>
<div>
<button onclick="go('grammar')">Fix Grammar</button>
<button onclick="go('spelling')">Fix Spelling</button>
<button onclick="go('punctuation')">Add Punctuation</button>
<button onclick="go('rewrite')">Rewrite</button>
<button id="v" onclick="voice()">🎙️ Voice</button>
</div>
<div id="out">Result yahan aayega</div>
<script>
async function go(mode){
  const text=document.getElementById('t').value;
  const out=document.getElementById('out');
  if(!text){out.innerText='Pehle kuch likho';return}
  out.innerText='Soch raha hoon...';
  try{
    const r=await fetch('/api/fix',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,mode})});
    const d=await r.json();
    out.innerText=d.result||d.error||'Kuch gadbad hui';
  }catch(e){out.innerText='Error: '+e}
}
function voice(){
  const S=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!S){alert('Chrome use karo');return}
  const s=new S();
  s.lang='en-IN';
  s.onresult=e=>{document.getElementById('t').value+=' '+e.results[0][0].transcript};
  s.start();
}
</script>
</body>
</html>
