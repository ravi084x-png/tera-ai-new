<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tera AI</title>
<style>
body{font-family:sans-serif;margin:0;padding:16px;background:#f5f5f5}
h2{margin-top:0}
textarea{width:100%;height:120px;font-size:17px;padding:10px;box-sizing:border-box}
button{font-size:16px;padding:12px;margin:4px 2px;border:0;border-radius:8px;background:#2563eb;color:#fff}
#mic{width:100%;font-size:20px;padding:18px;background:#16a34a;margin:8px 0}
#mic.on{background:#dc2626}
#out{background:#fff;padding:12px;margin-top:12px;min-height:60px;font-size:18px;border-radius:8px;white-space:pre-wrap}
</style>
</head>
<body>
<h2>✍️ Tera AI</h2>
<button id="mic" onclick="toggle()">🎙️ Bolna shuru karo</button>
<textarea id="t" placeholder="Kisi bhi bhasha mein bolo ya likho. Apne aap sahi ho jayega."></textarea>
<div id="out">Sahi text yahan aayega</div>
<button onclick="copyIt()">📋 Copy</button>
<script>
const t=document.getElementById('t'), out=document.getElementById('out');
const mic=document.getElementById('mic');
let timer, count=0, recording=false, mr=null, chunks=[], stream=null;

t.addEventListener('input',()=>{
  clearTimeout(timer);
  timer=setTimeout(fixText,1000);
});

async function send(body){
  const my=++count;
  out.innerText='Soch raha hoon...';
  try{
    const r=await fetch('/api/fix',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json();
    if(my!==count)return;
    if(d.heard&&body.audio)t.value=d.heard;
    out.innerText=d.result||d.error||'Kuch gadbad hui';
  }catch(e){if(my===count)out.innerText='Error: '+e}
}

function fixText(){
  const text=t.value.trim();
  if(!text){out.innerText='Sahi text yahan aayega';return}
  send({text});
}

async function toggle(){
  if(!recording){
    try{
      stream=await navigator.mediaDevices.getUserMedia({audio:true});
    }catch(e){alert('Mic ki permission do');return}
    chunks=[];
    mr=new MediaRecorder(stream);
    mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
    mr.onstop=()=>{
      stream.getTracks().forEach(x=>x.stop());
      const type=mr.mimeType||'audio/webm';
      const blob=new Blob(chunks,{type});
      const fr=new FileReader();
      fr.onload=()=>send({audio:fr.result.split(',')[1],mime:type});
      fr.readAsDataURL(blob);
    };
    mr.start();
    recording=true;
    mic.classList.add('on');
    mic.innerText='⏹️ Band karo';
  }else{
    recording=false;
    mic.classList.remove('on');
    mic.innerText='🎙️ Bolna shuru karo';
    mr.stop();
  }
}

function copyIt(){
  navigator.clipboard.writeText(out.innerText);
  alert('Copy ho gaya');
}
</script>
</body>
</html>
